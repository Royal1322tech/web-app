
name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project readiness
        id: readiness
        shell: bash
        run: |
          if [[ -f package.json && -f package-lock.json ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "React project not uploaded yet; skipping build."
          fi

      - name: Setup Node.js
        if: steps.readiness.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        if: steps.readiness.outputs.ready == 'true'
        run: npm ci

      - name: Lint
        if: steps.readiness.outputs.ready == 'true'
        run: npm run lint --if-present

      - name: Typecheck
        if: steps.readiness.outputs.ready == 'true'
        run: npx tsc --noEmit

      - name: Build
        if: steps.readiness.outputs.ready == 'true'
        run: npm run build

      - name: Install browser for regression checks
        if: steps.readiness.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium

      - name: Browser regression checks
        if: steps.readiness.outputs.ready == 'true'
        run: npm run test:e2e
