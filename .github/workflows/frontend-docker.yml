
name: Frontend Docker Build

on:
  workflow_run:
    workflows: ["Frontend CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify React project
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f package.json || ! -f package-lock.json ]]; then
            echo "ERROR: React project is not ready."
            echo "Both package.json and package-lock.json are required."
            exit 1
          fi

          node -e "
            const p = require('./package.json');
            if (!p.scripts || !p.scripts.build) {
              console.error('ERROR: Missing npm build script.');
              process.exit(1);
            }
          "

          echo "PASS: React project files verified"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/royal1322tech/web-app:sha-${{ github.event.workflow_run.head_sha }}
